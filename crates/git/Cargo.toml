[package]
name = "soloist-git"
description = "Version-control adapter for Soloist, driving the system `git` command line behind the core's GitRepository port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
soloist-core = { path = "../core" }
# The shared containment every external-tool adapter runs under: the invocation gets a process
# group of its own, a time limit, an output ceiling, and a guaranteed reap.
soloist-exec = { path = "../exec" }

[dev-dependencies]
tempfile = "3"
