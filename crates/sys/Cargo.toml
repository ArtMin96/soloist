[package]
name = "soloist-sys"
description = "OS adapters for Soloist (CPU/memory and port discovery over /proc, and notify-based file watching), behind the core's driven ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
soloist-core = { path = "../core" }
# The shared containment every external-tool adapter runs under: the child gets a process group of
# its own, a time limit, an output ceiling, and a guaranteed reap. It also resolves the login shell
# both of the shell-backed reads here go through.
soloist-exec = { path = "../exec" }
# CPU/memory and port discovery read `/proc` directly; `libc` is only for `sysconf`
# (clock ticks per second, page size) when converting those readings to seconds and bytes.
libc = "0.2"
# Recursive filesystem watching for file-watch restarts. Default features off: on Linux the
# inotify backend is unconditional, so this drops the macOS backend and the unused
# crossbeam-channel delivery path (we use the closure callback), keeping the bundle small.
notify = { version = "8", default-features = false }
# The file-watch port hands the adapter a tokio mpsc sender to forward changes on; only the
# sync primitives are needed here.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tempfile = "3"
# Proving that a probe nobody got an answer from left nothing behind means asking whether a signal
# still reaches its process group. `term` carries `openpty`, for the one test that reproduces the
# controlling-terminal regression directly: giving a probe a real pseudo-terminal to inherit.
nix = { version = "0.31", features = ["signal", "term"] }
# The integration tests construct the change channel the file-watch port forwards on, and
# the config-watch test drives the real reactor over this crate's real watcher.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
soloist-core = { path = "../core", features = ["testing"] }

# Acquiring a controlling terminal for this process (`setsid`, then opening the pty by path) is a
# per-thread kernel operation the libtest harness's worker threads do not sit on the right thread
# for, so this one test runs without the harness and drives its own `main`.
[[test]]
name = "shellenv_controlling_terminal"
path = "tests/shellenv_controlling_terminal.rs"
harness = false
