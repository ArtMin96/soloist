[package]
name = "soloist-forge"
description = "Pull-request adapter for Soloist, driving the GitHub `gh` command line behind the core's GitForge port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
soloist-core = { path = "../core" }
# The shared containment every external-tool adapter runs under: the invocation gets a process
# group of its own, a time limit, an output ceiling, and a guaranteed reap.
soloist-exec = { path = "../exec" }
# Everything this adapter reads from the tool is machine-readable JSON — the only form of its
# output whose meaning does not depend on the wording of a program we do not own.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
