# Supply-chain hardening for the UI's dependency installs (pnpm >= 10.16; this repo builds on
# pnpm 11). minimumReleaseAge holds back newly published versions (in minutes) so a compromised
# release has time to be caught and unpublished before it can be installed; 10080 = 7 days. It
# only gates *future* resolutions, so the current locked install is unaffected.
minimumReleaseAge: 10080

# Install scripts are denied unless named here. esbuild's postinstall links the platform binary it
# ships; it is already the compiler under Vite, so this grants nothing the build did not already
# run. It became explicit when @wdio/tauri-plugin (the e2e frontend plugin, dev-only and gated out
# of production bundles) pulled a second esbuild version into the tree.
allowBuilds:
  esbuild: true

#
# `trustPolicy: no-downgrade` is intentionally NOT enabled yet: the current pnpm-lock.yaml has a
# flagged entry (semver@6.3.1, a provenance/trust downgrade on a transitive dep) that makes every
# `pnpm install` hard-fail under it. Turning it on needs a deliberate lockfile remediation first —
# rebuild the lockfile (`pnpm clean --lockfile && pnpm install`) or add a justified
# `trustPolicyExclude` for the vetted entry — then set `trustPolicy: no-downgrade` here.

# Dependabot flags these as vulnerable, but every one is a nested dependency of dev tooling (vite,
# shadcn, vitest/jsdom, eslint, the wdio/mcp toolchains) rather than something in package.json, so
# Dependabot's normal "bump the manifest" PR has nothing direct to bump and the alerts sit open.
# Same shape as the @wdio/native-utils pin in e2e/pnpm-workspace.yaml: force the resolution up to
# the patched line via overrides instead. Caret ranges so future compatible patches stay pickable.
# dompurify is the one exception pulled in here: it's mermaid's own nested dependency, and bumping
# mermaid's manifest range alone still resolves it below the patched line, so it needs the same
# forced-resolution treatment as the dev-tooling transitives above.
overrides:
  nanoid: "^3.3.18"
  postcss: "^8.5.23"
  fast-uri: "^3.1.5"
  ip-address: "^10.3.1"
  hono: "^4.12.34"
  "@hono/node-server": "^1.19.15"
  js-yaml: "^4.3.1"
  brace-expansion: "^5.0.7"
  undici: "^7.29.0"
  dompurify: "^3.4.13"
